  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.75);
      --btn-bg: rgba(0, 0, 0, 0.85);
      --btn-bg-hover: rgba(30, 30, 30, 0.9);
      --btn-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Blurred profile photo behind everything, like the Linktree "blur" background */
    .backdrop {
      position: fixed;
      inset: -40px;
      background: url("assets/profile.jpg") center / cover no-repeat;
      filter: blur(40px) brightness(0.45);
      z-index: -1;
    }

    main {
      max-width: 580px;
      margin: 0 auto;
      padding: 48px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 16px 0 6px;
    }

    .bio {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .socials {
      display: flex;
      gap: 12px;
      margin: 16px 0 24px;
    }

    .socials a {
      color: var(--text);
      display: inline-flex;
      padding: 6px;
      border-radius: 8px;
      transition: transform 0.15s ease;
    }

    .socials a:hover { transform: scale(1.1); }

    .socials svg { width: 28px; height: 28px; }

    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .links a {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 8px 64px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .links a:hover {
      background: var(--btn-bg-hover);
      transform: scale(1.02);
    }

    .links a:focus-visible,
    .socials a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .links img {
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 6px;
      object-fit: cover;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .links a, .socials a { transition: none; }
      .links a:hover, .socials a:hover { transform: none; }
    }
  </style>
</head>
